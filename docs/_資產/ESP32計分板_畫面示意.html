:root{
  --dk-bg:#221F20; --dk-bar:#191718; --dk-raised:#2B2829; --dk-tile:#343132; --dk-line:#524D4E;
  --dk-text:#FFFFFF; --dk-text-2:#C9C4C1; --dk-text-3:#A39E9B;
  --brand:#FAD6DC; --ink:#2E2B2C;
  --page:#F6F5F4; --page-ink:#2E2B2C; --page-sub:#5C5754; --page-line:#DED9D5;
  --font:'Noto Sans TC',"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#191718;--page-ink:#FFFFFF;--page-sub:#C9C4C1;--page-line:#524D4E;color-scheme:dark}}
:root[data-theme="dark"]{--page:#191718;--page-ink:#FFFFFF;--page-sub:#C9C4C1;--page-line:#524D4E;color-scheme:dark}
body{background:var(--page);color:var(--page-ink);font-family:var(--font);padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:26px;margin:0;text-wrap:balance}
.lead{color:var(--page-sub);margin:6px 0 0;line-height:1.7;max-width:62ch}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
figcaption{font-weight:700;font-size:17px}
figcaption span{display:block;font-weight:400;font-size:14px;color:var(--page-sub);margin-top:2px}
.frame{width:100%;aspect-ratio:1280/720;max-width:100%;position:relative;overflow:hidden;border-radius:14px;border:6px solid #111;background:var(--dk-bg)}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--dk-bg);color:var(--dk-text);font-family:var(--font)}
.a{position:absolute}
.top{left:0;top:0;width:1280px;height:48px;background:var(--dk-bar)}
.logo{left:20px;top:7px;font-size:26px;font-weight:700;color:var(--brand)}
.tbl{left:110px;top:9px;font-size:24px;font-weight:700}
.use{left:0;width:1280px;top:11px;text-align:center;font-size:22px;color:var(--dk-text-2)}
.card{background:var(--dk-raised);border:1px solid var(--dk-line);border-radius:20px}
.card.dl{border:3px solid var(--brand)}
.pill{display:inline-block;border-radius:999px;padding:3px 13px;background:var(--dk-tile);color:var(--dk-text-2);font-size:18px;white-space:nowrap}
.pill.br{background:var(--brand);color:var(--ink)}
.av{border-radius:50%;background:var(--dk-tile);border:2px solid var(--dk-line);display:flex;align-items:center;justify-content:center;font-weight:700;box-sizing:border-box}
.btn{border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;box-sizing:border-box}
.pri{background:var(--brand);color:var(--ink)}
.dark{background:var(--dk-tile);color:var(--dk-text)}
.gho{border:2px solid var(--dk-line);color:var(--dk-text)}
.line{border:2px solid var(--dk-text-2);color:var(--dk-text)}
.scrim{left:0;top:0;width:1280px;height:720px;background:rgba(20,18,19,.82)}
.sheet{background:var(--dk-raised);border:1px solid var(--dk-line);border-radius:24px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:14px;box-sizing:border-box}
.money{font-size:72px;font-weight:700;color:var(--brand);line-height:1}
.tile{border-radius:14px;background:var(--dk-tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile b{font-size:26px}.tile i{font-style:normal;font-size:18px;color:var(--dk-text-2)}
.tile.on{background:var(--brand);color:var(--ink)}.tile.on i{color:var(--ink)}
.note{font-size:14px;color:var(--page-sub);line-height:1.7;max-width:62ch}
