<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評價頁小熊餅乾說明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap">
<style>
/* 會員 App 的色票（@migi/assets）；這一頁只做淺色，跟 App 一樣 */
:root{
  color-scheme: light;
  --brand:#FAD6DC; --brand-light:#FFE7EE; --brand-tint:#FFECF1; --ink:#2E2B2C; --white:#FFFFFF;
  --gray-1:#5C5754; --gray-2:#726D69; --gray-3:#ECEAE9; --gray-4:#F2F0EE; --divider:#DED9D5;
  --page:#F6F3F1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:24px;margin:0 0 8px;font-weight:800;text-wrap:balance}
.lede{color:var(--gray-1);font-size:15px;line-height:1.75;max-width:66ch;margin:0}
.lede b{color:var(--ink)}
.pair{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;margin-top:28px}
figure{margin:0;width:375px;max-width:100%}
figcaption{margin-top:10px;font-size:14px;color:var(--gray-1);text-align:center}
figcaption b{color:var(--ink)}

/* 手機外框 375 寬：遮罩 ＋ 置中白卡（照 buddies.jsx 的評價彈窗） */
.phone{position:relative;width:100%;aspect-ratio:375/760;border-radius:30px;overflow:hidden;background:rgba(0,0,0,.45);
  box-shadow:0 0 0 8px #1d1b1c,0 10px 30px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--white);border-radius:16px;width:100%;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.25);overflow:hidden}
.hd{padding:20px 20px 6px;text-align:center}
.hd .t{font-size:18px;font-weight:800}
.hd .s{font-size:12px;color:var(--gray-1);margin-top:3px}
.bd{padding:4px 20px 4px}
.sub{margin:10px 0 0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.desc{margin:2px 0 2px;font-size:13px;color:var(--gray-1)}
/* 🆕 補上的那一行：餅乾圖跟字一樣高、往下對齊字的中線 */
.desc.cookie{display:flex;align-items:center;flex-wrap:wrap}
.desc.cookie img{width:18px;height:18px;display:block;margin-left:3px}
.rows{margin-top:8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--divider)}
.row:first-child{border-top:0}
.rk{width:26px;height:32px;border-radius:6px;background:var(--gray-4);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.rk.one{background:var(--brand)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-light);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.nm{font-size:14px;font-weight:700;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:11px;color:var(--gray-2);font-weight:500}
.sc{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.tb{width:34px;height:34px;display:grid;place-items:center;flex:none}
.tb.down svg{transform:rotate(180deg)}
.info{margin:14px 0 2px;font-size:15px;font-weight:700}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 8px;font-size:13px;padding-bottom:10px}
.kv span:nth-child(odd){color:var(--gray-2)}
.ft{padding:12px 20px 18px;border-top:1px solid var(--divider)}
.ft div{background:var(--ink);color:var(--white);text-align:center;border-radius:12px;padding:13px 0;font-size:14px;font-weight:700}
.notes{margin:32px auto 0;max-width:66ch;display:grid;gap:8px}
.notes p{margin:0;color:var(--gray-1);font-size:14.5px;line-height:1.8}
.notes b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>評價頁補上「按讚可以拿到小熊餅乾」</h1>
  <p class="lede">會員 App 打完牌跳出的「給同桌評價」彈窗，<b>原本那一句後面直接接「，可獲得 1 個」和小熊餅乾圖</b>（不另起一行）。按讚本來就會發小熊餅乾（每讚一個人 1 個，同一場同一人只算一次），只是畫面上沒寫。其他地方都不動。</p>

  <div class="pair">
    <figure>
      <div class="phone"><div class="dlg" data-dlg></div></div>
      <figcaption><b>現在</b></figcaption>
    </figure>
    <figure>
      <div class="phone"><div class="dlg" data-dlg data-new></div></div>
      <figcaption><b>補上說明</b>（藍色虛線框起來的是改過的那一句，正式版沒有框）</figcaption>
    </figure>
  </div>

  <div class="notes">
    <p><b>規則</b>：餅乾是給讚的人拿，每讚一個人拿 1 個；同一場對同一個人取消再按不會重複拿。倒讚沒有餅乾。</p>
    <p><b>樣子</b>：同一句灰字，「1 個」後面放頂條那顆去背餅乾（18 像素，跟字差不多高）。已經做進會員 App（本機提交 48263f4，還沒推）。</p>
    <p><b>按完「完成評價」</b>：照舊，這一場拿到的餅乾從按鈕上方飛到頂條。</p>
  </div>
</div>
