<style>
:root{--brand:#FAD6DC;--brand-light:#FFE7EE;--brand-tint:#FFECF1;--accent:#C2607A;--accent-deep:#974B5F;--ink:#2E2B2C;--gray-1:#5C5754;--gray-2:#726D69;--gray-4:#F2F0EE;--field-bg:#F8F7F6;--field-bd:#ECE7E4;--hint:#B4AEA9;--page:#EFECEA}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);padding-block:24px 48px;padding-inline:16px;-webkit-user-select:none;user-select:none}
.top{max-width:390px;margin:0 auto 14px}.top h1{font-size:20px;margin:0 0 4px}.top p{margin:0;color:var(--gray-1);font-size:13px;line-height:1.6}
.phone{max-width:390px;margin:0 auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 0 0 1px var(--field-bd);padding-bottom:22px;position:relative;min-height:800px}
.hd{padding:16px 20px 0}.hd b{font-size:16px;display:block}.hd span{font-size:13px;color:var(--gray-1)}
.stage{margin:12px 20px 0;background:var(--brand);border-radius:20px;padding:18px 16px 14px;text-align:center;position:relative}
.bear{width:220px;height:220px;margin:-14px auto -10px;position:relative;touch-action:pan-y}
.nm{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}.nm b{font-size:18px}
.mood{font-size:13px;color:var(--gray-1);margin-top:3px;min-height:18px}
.card{margin:10px 20px 6px;border:1px solid var(--field-bd);border-radius:14px;padding:13px 14px}
.row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.row1 .lv{font-size:15px;font-weight:800}
.row1 .ck{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:800;cursor:pointer}
.row1 .ck img{width:38px;height:38px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--field-bd);touch-action:none;cursor:grab}
.row1{margin-top:-6px}
.ghostfood{position:fixed;width:60px;height:60px;border-radius:50%;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.stage.drop{box-shadow:inset 0 0 0 3px var(--accent)}
.subrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}.subrow .sub{margin-top:0}.dragtip{font-size:11px;color:var(--accent-deep);font-weight:700;white-space:nowrap}
.bar{height:9px;background:var(--gray-4);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.sub{font-size:11px;color:var(--gray-1);margin-top:6px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{border:0;border-radius:99px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:11px 0}
.feed1{flex:1;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.feed1 img{width:24px;height:24px;border-radius:50%;display:block;background:#fff}

.sec b{font-size:16px}.sec small{font-size:11px;color:var(--gray-2);font-weight:400;margin-left:6px}
.sec button{border:0;background:none;font:inherit;font-size:13px;color:var(--accent-deep);font-weight:700;cursor:pointer;padding:0}
.recent{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px}
.recent .r{text-align:center;cursor:pointer}
.recent p{margin:5px 0 0;font-size:11px;font-weight:700;color:var(--gray-1)}
.food{border-radius:50%;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;position:relative}

.food.emo{background:var(--brand-tint)}.food .em{line-height:1;font-size:38px;pointer-events:none}
.w{position:relative}

.toast.on{opacity:1}
.heart{position:absolute;left:50%;top:30%;font-size:24px;color:var(--accent);pointer-events:none;animation:hp 1.4s ease-out .75s both}
@keyframes hp{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(.9)}}

<div class="top"><h1>線上版 ＋ 新點心櫃</h1>
<p>上半部照線上現在的樣子，多了「拖曳餵食」：壓住數值卡右上角的餅乾，拖到小熊身上放開就餵一片（點一下照舊是打開點心櫃）。按鈕照舊可以用。點心櫃換成新設計：小熊餅乾以外的 19 種是隱藏點心，還沒拿到是「？？？」，拿到之後在點心櫃點它就能餵。</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* 3D 養成小熊 Lv1（2026-11-06 使用者：「可以把他轉成 3D 且會動嗎」→ 選 A 程式蓋 →「接到養成小熊主頁」選 B）
   用 three.js 的球體與曲面照 bear-lv1.webp 拼出來，沒有外部模型檔。
   · 只由 lib/Bear3D.jsx 動態 import ⇒ three（壓縮後約 150 KB）只在打開養成小熊那一頁才下載
   · three 鎖 0.128.0（package.json 寫死）：新版改了顏色管理與光的單位，畫出來的顏色會跑掉
   · 預覽與調整紀錄：https://claude.ai/artifact/BXRZp6ksadUMTZcZbHp73t（同日依使用者意見改了十幾輪）
   · 它是內容美術（只有會員 App 用）⇒ 顏色寫在這裡，不進 @migi/assets（硬規則 13）
   ⚠ 只有 Lv1 有 3D；Lv10、Lv20 還是 2D 圖（rewards.jsx 的 BearStageImg） */

// 顏色取自預設頭像（使用者 11-06 給的）：耳朵內側 #F6D8CB、眼睛鼻子 #593E33
// 毛：頭像是 #FEF2EA → 使用者「太深」#FFF7F2 →「再肉一點」#FFEFE6 →「稍微白一點」#FFF2EB
const FUR = 0xfff2eb, EAR = 0xf6d8cb, PINK = 0xe9a2a5, DARK = 0x593e33, PAD = 0xf6d8cb

/* el：放畫布的容器（正方形）。回傳 { act(種類), dispose() }；不支援 WebGL 時丟錯，由呼叫端退回 2D 圖。
   act：'jump' 跳一下｜'happy' 開心（餵食）｜'tickle' 怕癢（點身體）｜'wave' 揮手 */
async function createBear3D(el, { font = 'system-ui, sans-serif' } = {}) {
  /* ⚠ 不等字型（2026-11-06 使用者：「小熊讀取很慢」）：MIGI 先用現有字型畫，字型載好再重畫一次（見 bodyTex 底下） */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })   // 不支援 WebGL 會在這裡丟錯
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
  const cv = renderer.domElement
  cv.style.display = 'block'; cv.style.width = '100%'; cv.style.height = '100%'
  el.appendChild(cv)

  const scene = new THREE.Scene()
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100)
  camera.position.set(0, 2.15, 8.8)
  camera.lookAt(0, 1.62, 0)

  // 光的總量要讓正面剛好等於原色（量過：0.45 ＋ 0.45 暗 2%，0.5 ＋ 0.5 過曝成全白）
  scene.add(new THREE.AmbientLight(0xffffff, 0.462))
  const key = new THREE.DirectionalLight(0xffffff, 0.462); key.position.set(-1.5, 3, 8); scene.add(key)
  const rim = new THREE.DirectionalLight(0xffe4ea, 0.12); rim.position.set(4, 2, -4); scene.add(rim)

  // 三階平塗：亮面等於原色，側邊與背光只暗一點（使用者嫌膚色深，暗面從 185 提到 205）
  const grad = new THREE.DataTexture(new Uint8Array([205, 236, 255]), 3, 1, THREE.LuminanceFormat)
  grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true
  const disposables = [grad]
  const toon = (c, map) => { const m = new THREE.MeshToonMaterial({ color: c, gradientMap: grad, map: map || null }); disposables.push(m); return m }

  // 身體貼圖：毛色 ＋ 吊帶褲 ＋ MIGI（球面貼圖，正面在 u = 0.25）
  const bodyTex = (() => {
    const W = 1024, H = 512, c = document.createElement('canvas'); c.width = W; c.height = H
    const x = c.getContext('2d')
    const hex = (n) => '#' + n.toString(16).padStart(6, '0')
    const draw = () => {
    x.fillStyle = hex(FUR); x.fillRect(0, 0, W, H)
    x.fillStyle = hex(PINK)
    x.fillRect(0, H * 0.5, W, H * 0.5)                         // 褲子（下半身一圈）
    const cx = W * 0.25

  //   → 使用者：「手太長了」⇒ 手掌那頭往上收 0.1（y2 −0.46 → −0.36），彎度跟著縮小一點

    const a = Math.asin((r2 - r1) / (y1 - y2)), pts = []
    for (let i = 0; i <= 10; i++) { const t = Math.PI / 2 - (Math.PI / 2 - a) * i / 10; pts.push(new THREE.Vector2(r1 * Math.cos(t), y1 + r1 * Math.sin(t))) }
    for (let i = 1; i <= 16; i++) { const t = a - (a + Math.PI / 2) * i / 16; pts.push(new THREE.Vector2(r2 * Math.cos(t), y2 + r2 * Math.sin(t))) }

    pts.reverse()

       0.34 ～ 1.95  兩手舉高（咬下去那一刻舉起來，開心結束時放下）
     🗑 試過「兩手捧著、咬三口」，使用者嫌太複雜 */
  const BITES = [0.4], EAT_END = 0.75
  const HOLD = new THREE.Vector3(0, 1.6, 1.0), FROM = new THREE.Vector3(0.35, 0.25, 2.6)
  const ease = (p) => p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p)
  function frame(dt) {
    clock += dt
    const t = clock
    // 轉動：慣性 → 放開 2 秒後轉回正面
    if (!dragging) {
      rotY += vY; vY *= 0.92
      if (t - lastTouch > 2) rotY += (Math.round(rotY / (Math.PI * 2)) * Math.PI * 2 - rotY) * 0.06
    }
    root.rotation.y = rotY + ((t - lastTouch > 2.5 && !dragging) ? Math.sin(t * 0.55) * 0.18 : 0)
    // 呼吸
    const br = Math.sin(t * 2.3)
    body.scale.set(1 - br * 0.008, 1 + br * 0.022, 1 - br * 0.008)
    neck.position.y = 1.42 + br * 0.018
    // 頭輕輕歪
    neck.rotation.z = Math.sin(t * 0.8) * 0.07
    neck.rotation.x = Math.sin(t * 1.1 + 1) * 0.035
    neck.rotation.y = Math.sin(t * 0.6 + 2) * 0.08
    // 追著看：位置與強度都平滑跟上（不會一下子轉過去）
    gw += ((gOn ? 1 : 0) - gw) * (1 - Math.exp(-dt * 6))
    { const gk = 1 - Math.exp(-dt * 10); gx += (gTx - gx) * gk; gy += (gTy - gy) * gk }
    if (gw > 0.001) { neck.rotation.y += gx * 0.55 * gw; neck.rotation.x -= gy * 0.3 * gw }
    // 眨眼
    if (t > nextBlink) { blinkAt = t; nextBlink = t + 2.2 + Math.random() * 3 }
    const bp = (t - blinkAt) / 0.16
    const lid = bp >= 0 && bp <= 1 ? 1 - Math.sin(bp * Math.PI) * 0.92 : 1
    // 開心（餵食，2.4 秒）與怕癢（點身體，1.4 秒）：fade 是那段動作的強度，開頭很快到 1、最後 0.4 秒收掉
    // 吃東西：吃完那一刻接開心
    const ea = t - acts.eat
    if (happyAfterEat && ea >= EAT_END) { happyAfterEat = false; acts.happy = t; earFlick = t; earWhich = 0 }
    const hp = t - acts.happy, tk = t - acts.tickle
    const fH = hp >= 0 && hp < 1.2 ? ease(hp / 0.1) * (1 - ease((hp - 0.9) / 0.3)) : 0   // 開心 1.2 秒
    const fT = tk >= 0 && tk < 1.4 ? ease(tk / 0.08) * (1 - ease((tk - 1.0) / 0.4)) : 0
    const fChew = ea >= 0.34 && ea < EAT_END + 0.15 ? ease((ea - 0.34) / 0.08) * (1 - ease((ea - EAT_END) / 0.15)) : 0  // 咬一口
    const squint = 1 - 0.62 * Math.max(fH, fT, fChew * 0.85)   // 瞇眼笑
    for (const e of eyes) e.scale.y = lid * squint
    // 耳朵抖一下
    if (t > nextEar) { earFlick = t; earWhich = Math.random() < 0.5 ? -1 : 1; nextEar = t + 3 + Math.random() * 4 }
    const ep = t - earFlick
    for (const e of ears) {
      const on = earWhich === 0 || e.userData.s === earWhich      // 0 ＝ 兩隻一起（跳的時候）
      e.rotation.z = e.userData.base + (ep >= 0 && ep < 0.5 && on ? Math.sin(ep * 30) * (0.5 - ep) * 0.7 * e.userData.s : 0)
    }
    // 跳一下（蹲 → 跳 → 落地壓扁）
    let y = 0, sq = 1
    const jp = t - acts.jump
    if (jp >= 0 && jp < 0.95) {
      if (jp < 0.15) sq = 1 - Math.sin(jp / 0.15 * Math.PI / 2) * 0.1
      else if (jp < 0.7) { const p = (jp - 0.15) / 0.55; y = Math.sin(p * Math.PI) * 0.45; sq = 1 + Math.sin(p * Math.PI) * 0.06 }
      else { const p = (jp - 0.7) / 0.25; sq = 1 - Math.sin(p * Math.PI) * 0.08 }
    }
    // 開心（吃完餅乾）：跳一下、頭輕輕歪一下、瞇眼笑（squint 在上面）
    // 使用者：「這段簡單就好」—— 🗑 連跳、左右晃、兩手舉高揮
    let roll = 0
    if (fH > 0) {
      if (hp < 0.5) y += Math.sin(hp / 0.5 * Math.PI) * 0.22
      neck.rotation.z += Math.sin(Math.min(hp / 0.9, 1) * Math.PI) * 0.12 * fH
    }
    // 怕癢（點身體）：縮起來、快速扭來扭去、小跳
    if (fT > 0) {
      roll += Math.sin(tk * 38) * 0.07 * fT
      y += Math.abs(Math.sin(tk * 19)) * 0.06 * fT
      sq *= 1 - 0.05 * fT
      neck.rotation.z += Math.sin(tk * 21) * 0.09 * fT
      neck.rotation.x += 0.12 * fT   // 低頭笑
    }
    // 吃東西：餅乾飛進嘴巴 → 咬一口不見；頭點一下、臉頰鼓、噴餅乾屑
    if (ea >= 0 && ea < EAT_END + 0.3) {
      while (bitesDone < BITES.length && ea >= BITES[bitesDone]) {
        bitesDone++
        spray(new THREE.Vector3(0, neck.position.y + 0.1, 1.05))
      }
      snack.visible = ea < BITES[0]
      const p = ease(ea / 0.38)
      snack.position.lerpVectors(FROM, HOLD, p); snack.position.y += Math.sin(p * Math.PI) * 0.5
      snack.rotation.z = (1 - p) * 4
      snack.scale.setScalar(0.45 + 0.55 * p)
      // 咬下去那一下頭往前點、臉頰鼓
      let nod = 0
      for (const b of BITES) { const d = ea - b; if (d > -0.06 && d < 0.24) nod += Math.sin((d + 0.06) / 0.3 * Math.PI) }
      neck.rotation.x += nod * 0.16 * fChew
      head.scale.x = HR[0] * (1 + 0.04 * fChew)
    } else {
      snack.visible = false
      head.scale.x = HR[0]
    }
    for (const c of crumbs) {
      if (!c.m.visible) continue
      c.life -= dt
      c.v.y -= 4.5 * dt
      c.m.position.addScaledVector(c.v, dt)
      c.m.scale.setScalar(Math.max(0.01, c.life / 0.8))
      if (c.life <= 0 || c.m.position.y < 0.05) c.m.visible = false
    }
    bear.position.y = y
    bear.scale.set(2 - sq, sq, 2 - sq)
    bear.rotation.z = roll
    shadow.scale.setScalar(1 - y * 0.35)
    shMat.opacity = 1 - y * 0.6
    // 揮手（右手舉起來搖 2 秒）；開心時兩手一起擺
    const wp = t - acts.wave
    for (const a of arms) {
      let r = a.userData.base + Math.sin(t * 2.3) * 0.02 * a.userData.s
      if (a.userData.s === 1 && wp >= 0 && wp < 2.2) {
        const up = ease(wp / 0.3) * (1 - ease((wp - 1.9) / 0.3))
        r = a.userData.base + up * (2.3 + Math.sin(wp * 14) * 0.28)
      }
      const s = a.userData.s
      // 怕癢：雙手上下擺動（11-07 使用者：「搔癢改成雙手上下擺動」）—— 兩手往外張開，一起快速上下拍
      //   🗑 之前是雙手抱胸（往前抬、往中間收），手臂改短改後之後常常抱進肚子裡看不到
      //   左右手一上一下（使用者：「搔癢時左右手要一上一下」）：擺動乘上 s ⇒ 兩邊相位相反
      if (fT > 0) r += s * (0.75 + s * Math.sin(tk * 22) * 0.5) * fT
      // 吃餅乾：從咬下去到開心跳完，兩手舉高（使用者 11-06：「餵餅乾可以雙手舉起來」）
      const fUp = Math.max(fChew, fH)
      if (fUp > 0) r += s * 2.3 * fUp
      // 追著看時兩手往那邊伸：往前抬、往外舉；在那一側的手舉得比較高，目標越高舉越高（吃東西時讓位給舉手）
      const gr = gw * (1 - fUp)
      if (gr > 0.001) {
        const cl = (v) => Math.max(-1, Math.min(1, v))
        r += s * (0.8 + 0.45 * cl(gy) + 0.35 * cl(s * gx)) * gr
      }
      a.rotation.x = -0.75 * gr
      a.rotation.z = r
    }
    fit()
    renderer.render(scene, camera)
  }

  // 看不到就不畫（切到別頁、捲出畫面、App 切到背景）—— 省手機電量
  let visible = true, raf = 0, prev = 0
  const loop = (now) => {
    raf = 0
    frame(prev ? Math.min(0.05, (now - prev) / 1000) : 0); prev = now
    if (visible && !document.hidden) raf = requestAnimationFrame(loop)
  }
  const start = () => { if (!raf && visible && !document.hidden) { prev = 0; raf = requestAnimationFrame(loop) } }
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(([e]) => { visible = e.isIntersecting; start() }) : null
  if (io) io.observe(el)
  const onVis = () => start()
  document.addEventListener('visibilitychange', onVis)
  frame(0)
  start()

  return {
    act,
    look,
    /* 拍一張現在的畫面（透明底）—— Bear3D.jsx 拿它當下次載入中的佔位圖：跟 3D 是同一隻熊，換過去看不出接縫。
       ⚠ 沒開 preserveDrawingBuffer ⇒ 一定要在同一個步驟裡先畫再讀，不然讀到的是空白 */
    snapshot() {
      fit(); renderer.render(scene, camera)
      return cv.toDataURL('image/webp', 0.9)
    },
    dispose() {
      if (raf) cancelAnimationFrame(raf)
      raf = 0; visible = false
      if (io) io.disconnect()
      document.removeEventListener('visibilitychange', onVis)
      el.removeEventListener('pointerdown', onDown)
      el.removeEventListener('pointermove', onMove)
      el.removeEventListener('pointerup', onUp)
      el.removeEventListener('pointercancel', onUp)
      el.removeEventListener('pointerleave', onUp)
      for (const d of disposables) d.dispose()
      renderer.dispose()
      cv.remove()
    },
  }
}

  { k: 'pudding', n: '焦糖布丁', c: 'sweet', have: 3, g: 15 },
  { k: 'tiramisu', n: '提拉米蘇', c: 'sweet', have: 0, g: 20 },
  { k: 'cupcake', n: '杯子蛋糕', c: 'sweet', have: 2, g: 15 },
  { k: 'donut', n: '甜甜圈', c: 'sweet', have: 0, g: 15 },
  { k: 'castella', n: '蜂蜜蛋糕', c: 'sweet', have: 0, g: 15, e: '🍰' },
  { k: 'daifuku', n: '草莓大福', c: 'sweet', have: 1, g: 15, e: '🍡' },
  { k: 'milktea', n: '珍珠奶茶', c: 'drink', have: 2, g: 12 },
  { k: 'smilk', n: '草莓牛奶', c: 'drink', have: 0, g: 10, e: '🥛' },
  { k: 'lemon', n: '檸檬紅茶', c: 'drink', have: 4, g: 10, e: '🍋' },
  { k: 'cocoa', n: '熱可可', c: 'drink', have: 0, g: 12, e: '☕' },
  { k: 'juice', n: '蘋果汁', c: 'drink', have: 0, g: 10, e: '🧃' },
  { k: 'onigiri', n: '鮭魚飯糰', c: 'meal', have: 0, g: 25, e: '🍙' },
  { k: 'pancake', n: '蜂蜜鬆餅', c: 'meal', have: 0, g: 25, e: '🥞' },
  { k: 'ramen', n: '拉麵', c: 'meal', have: 0, g: 30, e: '🍜' },
  { k: 'xlb', n: '小籠包', c: 'meal', have: 0, g: 25, e: '🥟' },
  { k: 'sandwich', n: '三明治', c: 'meal', have: 0, g: 20, e: '🥪' },
  { k: 'mooncake', n: '月餅', c: 'limited', have: 0, g: 30, e: '🥮' },
  { k: 'bday', n: '生日蛋糕', c: 'limited', have: 0, g: 50, e: '🎂' },
  { k: 'xmas', n: '聖誕薑餅', c: 'limited', have: 0, g: 30, e: '🎄' },
]
const BY = Object.fromEntries(FOODS.map((f) => [f.k, f]))
const recent = ['daifuku', 'cupcake', 'lemon', 'pudding']
const face = (f) => '<span class="food' + (IMG[f.k] ? '' : ' emo') + '">' + (IMG[f.k] ? '<img src="' + IMG[f.k] + '" alt="">' : '<span class="em">' + f.e + '</span>') + '</span>'
let lv = 2, grow = 60, bear = null, cat = 'all', fed = false
const $ = (id) => document.getElementById(id)
let tt = 0; const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1500) }

function paint() {
  const ck = BY.cookie.have
  $('lv').textContent = lv; $('bar').style.width = grow + '%'; $('ckn').textContent = '×' + ck
  $('sub').textContent = '成長 ' + grow + '% · 再 ' + Math.ceil((100 - grow) / 10) + ' 片升 Lv.' + (lv + 1)
  $('feed1').disabled = ck <= 0; $('feedall').disabled = ck <= 0
  $('mood').textContent = fed ? '「好好吃！」' : '「肚子有點餓了…」'
  const owned = FOODS.filter((f) => f.have > 0).length
  $('got').textContent = '已發現 ' + owned + '／' + FOODS.length
  $('got2').textContent = '已發現 ' + owned + '／' + FOODS.length
  $('gotbar').style.width = (owned / FOODS.length * 100) + '%'
  $('recent').innerHTML = recent.map((k) => '<div class="r" data-k="' + k + '"><div class="w">' + face(BY[k]) + (BY[k].have ? '<span class="cnt">×' + BY[k].have + '</span>' : '') + '</div><p>' + BY[k].n + '</p></div>').join('')
  $('chips').innerHTML = CATS.map(([k, n]) => '<button class="chip' + (k === cat ? ' on' : '') + '" data-c="' + k + '">' + n + '</button>').join('')
  $('grid').innerHTML = FOODS.filter((f) => cat === 'all' || f.c === cat).map((f) => {
    const hide = !f.have && f.k !== 'cookie'
    return '<div class="cell' + (hide ? ' no' : '') + '" data-k="' + f.k + '"><div class="w">' + face(f) + (f.have ? '<span class="cnt">×' + f.have + '</span>' : '') + (f.have && f.c === 'limited' ? '<span class="tag">限定</span>' : '') + '</div><p>' + (hide ? '？？？' : f.n) + '</p></div>'
  }).join('')
}
function feed(k, n = 1) {
  const f = BY[k]; if (!f || f.have <= 0) return
  n = Math.min(n, f.have); f.have -= n; fed = true
  bear && bear.act('eat')
  const h = document.createElement('span'); h.className = 'heart'; h.textContent = '♥'; document.querySelector('.stage').appendChild(h); setTimeout(() => h.remove(), 2400)
  let g = grow + f.g * n, up = 0; while (g >= 100) { g -= 100; up++ }
  setTimeout(() => { grow = g; lv += up; paint(); toast(up ? '升級！Lv.' + lv : f.n + (n > 1 ? ' ×' + n : '') + '　成長 +' + f.g * n + '%') }, 750)
  setTimeout(() => { fed = false; paint() }, 3000)
  paint()
}
createBear3D($('bear'), {}).then((b) => { bear = b })
paint()
$('feed1').onclick = () => feed('cookie', 1)
$('feedall').onclick = () => feed('cookie', BY.cookie.have)
/* 數值卡右上角的餅乾：點一下＝打開點心櫃（跟線上一樣），壓住拖到小熊身上＝餵一片；壓住時小熊追著看 */
const stage = document.querySelector('.stage'), bearEl = $('bear'), ckImg = $('ckpill').querySelector('img')
const lookAt = (x, y) => { if (!bear) return; const r = bearEl.getBoundingClientRect(); bear.look((x - (r.left + r.width / 2)) / (r.width / 2), -(y - (r.top + r.height * 0.42)) / (r.height / 2)) }
const overStage = (x, y) => { const r = stage.getBoundingClientRect(); return x > r.left && x < r.right && y > r.top && y < r.bottom }
let p = null
$('ckpill').addEventListener('pointerdown', (e) => { p = { x0: e.clientX, y0: e.clientY, drag: false, g: null }; if (e.pointerType === 'mouse') e.preventDefault() })
window.addEventListener('pointermove', (e) => {
  if (!p) return
  if (!p.drag && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 6) {
    if (BY.cookie.have <= 0) { toast('餅乾吃完了'); p = null; return }
    p.drag = true; p.g = document.createElement('img'); p.g.src = ckImg.src; p.g.className = 'ghostfood'; document.body.appendChild(p.g)
  }
  if (p.drag) { p.g.style.left = e.clientX + 'px'; p.g.style.top = e.clientY + 'px'; stage.classList.toggle('drop', overStage(e.clientX, e.clientY)); lookAt(e.clientX, e.clientY) }
})
window.addEventListener('pointerup', (e) => {
  if (!p) return
  if (!p.drag) $('cab').classList.add('on')
  else if (overStage(e.clientX, e.clientY)) feed('cookie', 1)
  if (p.g) p.g.remove()
  stage.classList.remove('drop'); bear && bear.look(null); p = null
})
$('open').onclick = () => $('cab').classList.add('on')
$('back').onclick = () => { $('cab').classList.remove('on'); $('detail').hidden = true }
$('chips').onclick = (e) => { const b = e.target.closest('.chip'); if (b) { cat = b.dataset.c; paint() } }
const showDetail = (k) => {
  const f = BY[k], d = $('detail'), hide = !f.have && f.k !== 'cookie'
  d.innerHTML = (hide ? '<span class="food" style="background:var(--gray-4);font-size:28px;color:var(--gray-2);font-weight:800">？</span>' : face(f)) + '<div><b>' + (hide ? '隱藏點心' : f.n + '　×' + f.have) + '</b><span>' + (hide ? '還沒發現。繼續打牌、報到，說不定會遇到' : '餵一個成長 +' + f.g + '%') + '</span></div>' + (f.have ? '<button class="fb">餵小熊</button>' : '') + '<button class="x" aria-label="關閉">✕</button>'
  d.hidden = false
  d.querySelector('.x').onclick = () => { d.hidden = true }
  const fb = d.querySelector('.fb'); if (fb) fb.onclick = () => { d.hidden = true; $('cab').classList.remove('on'); setTimeout(() => feed(k), 300) }
}
$('grid').onclick = (e) => { const c = e.target.closest('.cell'); if (c) showDetail(c.dataset.k) }
$('recent').onclick = (e) => { const c = e.target.closest('.r'); if (c) { $('cab').classList.add('on'); showDetail(c.dataset.k) } }
</script></body></html>
