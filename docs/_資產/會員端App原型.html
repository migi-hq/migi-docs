<head>

<title>MIGI 會員端 App 互動預覽</title>
<style>
  :root{--font-sans:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#EFEDEB;font-family:var(--font-sans);display:flex;flex-direction:column;align-items:center;padding:24px 12px;min-height:100vh}
  .seglabel{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
  .fseg{border:0.5px solid #C9C5C2;border-radius:999px;padding:6px 15px;font-size:13px;cursor:pointer;background:#FFF;color:#7A7572}
  .fseg.on{background:#FAD6DC;border-color:#F0C4CE;color:#2E2B2C;font-weight:500}
  #iapp{--xs:11px;--s:12px;--m:13px;--l:14px;--xl:17px;--h:34px;width:330px;background:#FFFFFF;border:0.5px solid #E0DEDC;border-radius:34px;overflow:hidden}

  #iapp p{margin:0}
  .it{flex:1;text-align:center;border-radius:999px;padding:8px 0;font-size:10px;color:#9A9491;cursor:pointer}
  .it.on{background:#FAD6DC;color:#2E2B2C;font-weight:500}
  .ic{background:#FFFFFF;border:0.5px solid #ECEAE9;border-radius:14px;padding:10px 12px}
  .irow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:0.5px solid #F2F0EE}
  .itile{border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:500;color:#2E2B2C;width:28px;height:28px;font-size:var(--s);flex:0 0 28px}
  .ichip{background:#F0EFEE;border-radius:999px;padding:5px 13px;font-size:var(--s);color:#5A5556;cursor:pointer;display:inline-block;margin:0 4px 6px 0}
  .ichip.on{background:#FAD6DC;color:#2E2B2C;font-weight:500}
  .ibtn{border:none;border-radius:999px;cursor:pointer;font-weight:500;font-family:var(--font-sans)}
  @keyframes pop{0%{transform:scale(0.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes spin{100%{transform:rotate(1440deg)}}
  .toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:#2E2B2C;color:#FFF;font-size:12px;padding:9px 18px;border-radius:999px;z-index:9;animation:pop .3s;white-space:nowrap}
  .note{margin-top:18px;font-size:12px;color:#9A9491;text-align:center;max-width:330px;line-height:1.6}
</style>
</head>
<body>

    <span style="width:14px;height:8px;border:1px solid #2E2B2C;border-radius:2px;display:inline-block;position:relative"><span style="position:absolute;inset:1px;right:4px;background:#2E2B2C;border-radius:1px"></span></span>

var pages={};
pages[0]=function(){return '<div style="padding:0 20px"><div style="background:#FAD6DC;border-radius:22px;padding:17px 18px 15px;position:relative;overflow:hidden">'+deco+'<div style="display:flex;justify-content:space-between;align-items:center"><p style="font-size:var(--s);color:#5A5556">我的點數</p><span style="background:rgba(255,255,255,0.7);border-radius:999px;padding:3px 10px;font-size:10px;font-weight:500;color:#2E2B2C">焦糖布丁 · 金牌熊 II</span></div><p style="margin-top:6px;font-size:var(--h);font-weight:500;color:#2E2B2C">'+f(St.points)+'<span style="font-size:var(--l);font-weight:400;margin-left:4px;color:#5A5556">點</span></p><div style="display:flex;gap:8px;margin-top:13px"><button onclick="_topup()" class="ibtn" style="flex:1;background:#2E2B2C;padding:10px 0;font-size:var(--m);color:#FFF">儲值</button><button class="ibtn" style="flex:1;background:rgba(255,255,255,0.75);padding:10px 0;font-size:var(--m);color:#2E2B2C">明細</button></div></div></div>'+

  '<div style="padding:14px 20px 0"><p style="font-size:var(--s);color:#7A7572;margin-bottom:8px">牌型</p><div><span class="ichip on" onclick="_sel(this)">台 16 張</span><span class="ichip" onclick="_sel(this)">三人麻將</span></div></div>'+

pages[2]=function(){return '<div style="padding:0 20px"><div style="background:#FAD6DC;border-radius:22px;padding:15px 18px;position:relative;overflow:hidden">'+deco+'<div style="display:flex;align-items:center;gap:12px"><div style="width:46px;height:46px;border-radius:50%;background:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 46px"><span style="font-size:var(--xs);font-weight:500;color:#2E2B2C;line-height:1.1">金牌熊</span><span style="font-size:10px;color:#7A7572">II</span></div><div style="flex:1"><p style="font-size:var(--m);font-weight:500;color:#2E2B2C">距離白金熊還差 180 分</p><div style="height:8px;background:rgba(255,255,255,0.6);border-radius:999px;margin-top:7px"><div style="width:64%;height:8px;background:#C2607A;border-radius:999px"></div></div></div></div></div></div>'+
  '<div style="padding:14px 20px 0"><div style="background:#FFF7F9;border:0.5px solid #F0CDD7;border-radius:14px;padding:11px 13px;display:flex;gap:9px;align-items:flex-start"><span style="flex:0 0 24px;width:24px;height:24px;border-radius:7px;background:#FAD6DC;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#A4566A">AI</span><div style="flex:1"><p style="font-size:var(--xs);font-weight:500;color:#A4566A">今日洞察</p><p style="margin-top:2px;font-size:var(--xs);color:#7A7572;line-height:1.5">妳今天放槍偏多,局末多留意安全牌;在 50/20 級距勝率最高,是妳的主場 ♡</p></div></div></div>'+
  '<div style="padding:14px 20px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div class="ic"><p style="font-size:var(--xs);color:#7A7572">和牌率</p><p style="font-size:20px;font-weight:500;color:#2E2B2C">23.4%</p></div><div class="ic"><p style="font-size:var(--xs);color:#7A7572">放槍率</p><p style="font-size:20px;font-weight:500;color:#2E2B2C">11.2%</p></div><div class="ic"><p style="font-size:var(--xs);color:#7A7572">平均順位</p><p style="font-size:20px;font-weight:500;color:#2E2B2C">2.4</p></div><div class="ic"><p style="font-size:var(--xs);color:#7A7572">全國排名</p><p style="font-size:20px;font-weight:500;color:#2E2B2C">#128</p></div></div>'+
  '<div style="padding:14px 20px 6px"><p style="font-size:var(--m);font-weight:500;color:#2E2B2C">各積分級距勝率(本月)</p></div>'+
  '<div style="padding:0 20px 16px"><div class="irow" style="padding:7px 0"><span style="font-size:var(--s);color:#2E2B2C;flex:0 0 54px">50/20</span><div style="flex:1;height:6px;background:#F0EFEE;border-radius:999px"><div style="width:58%;height:6px;background:#C2607A;border-radius:999px"></div></div><span style="font-size:var(--xs);color:#7A7572;flex:0 0 54px;text-align:right">58%·12場</span></div><div class="irow" style="padding:7px 0"><span style="font-size:var(--s);color:#2E2B2C;flex:0 0 54px">30/10</span><div style="flex:1;height:6px;background:#F0EFEE;border-radius:999px"><div style="width:44%;height:6px;background:#C2607A;border-radius:999px"></div></div><span style="font-size:var(--xs);color:#7A7572;flex:0 0 54px;text-align:right">44%·8場</span></div><div class="irow" style="padding:7px 0;border-bottom:none"><span style="font-size:var(--s);color:#2E2B2C;flex:0 0 54px">純娛樂</span><div style="flex:1;height:6px;background:#F0EFEE;border-radius:999px"><div style="width:67%;height:6px;background:#C2607A;border-radius:999px"></div></div><span style="font-size:var(--xs);color:#7A7572;flex:0 0 54px;text-align:right">67%·5場</span></div></div>';};

  }

  // nurture(每日養成)
  var ft=St.feedLog.length?St.feedLog.join(' · '):'打牌 +20 · 點餐 +10 · 揪人 +30';
  return subtabs+
  '<div style="padding:12px 20px 0"><div style="background:#FAD6DC;border-radius:22px;padding:16px;position:relative;overflow:hidden;text-align:center"><span style="position:absolute;top:14px;right:16px;font-size:var(--m);font-weight:500;color:#A4566A">Lv.'+St.bearLv+'</span><div id="bearArt" style="display:flex;justify-content:center">'+bearSVG(82)+'</div><div style="height:8px;background:rgba(255,255,255,0.6);border-radius:999px;margin-top:10px"><div id="xpbar" style="width:'+St.bearXp+'%;height:8px;background:#C2607A;border-radius:999px;transition:width .5s"></div></div><p style="margin-top:7px;font-size:var(--xs);color:#A4566A">'+ft+'</p><button onclick="_feed()" class="ibtn" style="margin-top:10px;background:#2E2B2C;padding:8px 20px;font-size:var(--s);color:#FFF">餵小熊一口（模擬打牌 +20）</button></div></div>'+

  '<div style="padding:14px 20px 6px"><div class="irow" style="border:0.5px solid #F0CDD7;border-radius:14px;padding:11px 13px;background:#FFF;border-bottom:1px solid #F0CDD7"><span class="itile" style="background:#FFE7EE">限</span><div style="flex:1"><p style="font-size:var(--s);font-weight:500;color:#2E2B2C">限時活動 · 櫻花季雙倍養成</p><p style="font-size:var(--xs);color:#C2607A">剩 2 天 · 打牌養成 ×2</p></div></div></div>'+

var cur=0;
function _go(i){cur=i;B().innerHTML=pages[i]();for(var k=0;k<5;k++)document.getElementById('it'+k).className='it'+(k==i?' on':'');}
function _iz(lg){document.getElementById('iapp').className=lg?'lg':'';document.getElementById('iz0').className='fseg'+(lg?'':' on');document.getElementById('iz1').className='fseg'+(lg?' on':'');}
function _sel(el){var ch=el.parentNode.children;for(var i=0;i<ch.length;i++)ch[i].classList.remove('on');el.classList.add('on');}
function _topup(){St.points+=5000;toast('儲值 +5,000 點 ♡');_go(0);}
function _match(){if(St.matchState==='idle'){St.matchState='queuing';toast('開始配桌,候補中…');_go(1);}else if(St.matchState==='queuing'){St.matchState='matched';addXp(20,'配桌');St.tasks.play.cur=Math.min(St.tasks.play.max,St.tasks.play.cur+1);if(St.tasks.play.cur>=St.tasks.play.max)St.tasks.play.done=true;toast('配桌成功! 養成 +20');_go(1);}else{toast('祝妳打牌順利 ♡');}}
function _invite(name){St.tasks.buddy.done=true;addXp(30,'揪人');toast('已揪 '+name+'! 養成 +30');}
function _feed(){addXp(20,'打牌');var bar=document.getElementById('xpbar');var art=document.getElementById('bearArt');if(bar)bar.style.width=St.bearXp+'%';if(art){art.style.animation='none';void art.offsetWidth;art.style.animation='pop .4s';}_go(4);}
function _checkin(){if(St.checkedToday){toast('今天簽過囉 ♡');return;}St.checkedToday=true;St.checkDays++;St.gachaTickets++;toast('簽到成功! 連續 '+St.checkDays+' 天,得扭蛋券 ×1');_go(4);}
function _gacha(){
  var ov=document.createElement('div');ov.id='gachaOv';
  ov.style.cssText='position:absolute;inset:0;background:#FCE9EF;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:24px';
  ov.innerHTML=
    '<button onclick="document.getElementById(&#39;gachaOv&#39;).remove()" style="position:absolute;top:16px;right:18px;background:none;border:none;font-size:24px;color:#A4566A;cursor:pointer">×</button>'+
    '<p style="font-size:17px;font-weight:600;color:#2E2B2C">扭蛋摸彩</p>'+
    '<div id="gachaCircle" style="margin-top:20px;width:150px;height:150px;border-radius:50%;background:#FAD6DC;display:flex;align-items:center;justify-content:center"><div style="width:88px;height:88px;border-radius:50%;background:#FCE9EF;display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:50%;background:#FAD6DC"></div></div></div>'+

      '<button onclick="_pull(&#39;points&#39;)" class="ibtn" style="background:#2E2B2C;color:#FFF;padding:13px;font-size:14px">轉一顆 · '+St.gachaCost+' 點</button>'+
      '<button onclick="_pull(&#39;ticket&#39;)" class="ibtn" style="background:'+(St.gachaTickets>0?'#FAD6DC':'#EDEAE8')+';color:'+(St.gachaTickets>0?'#2E2B2C':'#B5B0AC')+';padding:13px;font-size:14px">用扭蛋券（'+St.gachaTickets+' 張）</button>'+
    '</div>'+
    '<p style="margin-top:14px;font-size:11px;color:#9A9491;text-align:center;line-height:1.6">保底 10 抽必中 · 機率公開<br>多消費 · 克制不賭博</p>'+
    '<p style="margin-top:6px;font-size:11px;color:#9A9491">點數 '+f(St.points)+' · 券 '+St.gachaTickets+' 張</p>';
  document.getElementById('iapp').appendChild(ov);
}
function _pull(by){
  if(by==='points'){if(St.points<St.gachaCost){toast('點數不足 ♡');return;}St.points-=St.gachaCost;}
  else{if(St.gachaTickets<=0){toast('沒有扭蛋券,簽到可拿 ♡');return;}St.gachaTickets--;}
  var pr=[['小熊帽子','🎀'],['限定牌尺','✨'],['免費奶茶券','🧋'],['點數 +100','💰'],['小熊貼圖','🐻'],['再接再厲','🍀']];
  var g=pr[Math.floor(Math.random()*pr.length)];
  if(g[0].indexOf('點數')>=0)St.points+=100;
  if(g[0].indexOf('奶茶券')>=0)St.coupons.push({n:'免費經典奶茶',k:'餐飲',e:'🧋'});
  var ov=document.getElementById('gachaOv');
  ov.innerHTML='<div style="font-size:60px;animation:spin 1.2s ease-out">🥚</div><p style="color:#A4566A;font-size:13px;margin-top:14px">轉啊轉…</p>';
  setTimeout(function(){
    ov.innerHTML='<div style="background:#FFF;border-radius:20px;padding:26px 32px;text-align:center;animation:pop .4s"><div style="font-size:54px">'+g[1]+'</div><p style="margin-top:12px;font-size:16px;font-weight:600;color:#2E2B2C">抽到「'+g[0]+'」</p><button onclick="document.getElementById(&#39;gachaOv&#39;).remove();_go(4)" class="ibtn" style="margin-top:16px;background:#C2607A;color:#FFF;padding:9px 26px;font-size:13px">收下 ♡</button></div>';
  },1300);
}
function _coupons(){

  ov.style.cssText='position:absolute;inset:0;background:rgba(46,43,44,0.4);display:flex;align-items:flex-end;z-index:30';
  var rows=St.coupons.map(function(c){return '<div style="display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:0.5px solid #F2F0EE"><span style="width:34px;height:34px;border-radius:8px;background:#FFE7EE;display:flex;align-items:center;justify-content:center;font-size:17px">'+c.e+'</span><div style="flex:1"><p style="font-size:13px;font-weight:500;color:#2E2B2C">'+c.n+'</p><p style="font-size:11px;color:#7A7572">'+c.k+'類 · 結帳時可用</p></div><span style="font-size:11px;color:#C2607A;background:#FBEAF0;padding:3px 9px;border-radius:999px">可用</span></div>';}).join('');

  ov.innerHTML='<div style="background:#FFF;border-radius:22px 22px 0 0;width:100%;padding:18px 20px 24px;animation:pop .3s"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><p style="font-size:16px;font-weight:600;color:#2E2B2C">我的優惠券</p><button onclick="document.getElementById(&#39;cpOv&#39;).remove()" style="background:none;border:none;font-size:22px;color:#9A9491;cursor:pointer">×</button></div><p style="font-size:11px;color:#9A9491;margin-bottom:8px">券只折抵檯費/餐飲/派車等服務費 · 在各結帳頁自動帶出</p>'+rows+'</div>';
  ov.onclick=function(e){if(e.target===ov)ov.remove();};
  document.getElementById('iapp').appendChild(ov);
}
