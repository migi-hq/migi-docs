<svg viewBox="0 0 560 940" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#E8E5E2" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid5" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M 90 0 L 0 0 0 90" fill="none" stroke="#D8D4D0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="560" height="940" fill="#FBFAF9"/>

  <!-- 標題 -->
  <text x="34" y="40" fill="#2E2B2C" font-size="20" font-weight="700">MIGI 咪吉麻將 · 15 坪狹長型首店</text>
  <text x="34" y="61" fill="#9B9591" font-size="12">面寬 4.5m × 進深 11m ≈ 49.5㎡ ≈ 15 坪 · 6 桌 · 比例 1:60</text>

  <!-- 牆內範圍:x:120~390(270px=4.5m→60px/m), y:90~750(660px=11m) -->
  <rect x="120" y="90" width="270" height="660" fill="url(#grid)"/>
  <rect x="120" y="90" width="270" height="660" fill="url(#grid5)"/>
  <rect x="120" y="90" width="270" height="660" fill="none" stroke="#2E2B2C" stroke-width="6"/>

  <!-- 尺寸:上緣面寬 -->
  <line x1="120" y1="74" x2="390" y2="74" stroke="#C2607A" stroke-width="1"/>
  <line x1="120" y1="68" x2="120" y2="80" stroke="#C2607A" stroke-width="1"/>
  <line x1="390" y1="68" x2="390" y2="80" stroke="#C2607A" stroke-width="1"/>
  <rect x="228" y="64" width="54" height="16" fill="#FBFAF9"/>
  <text x="255" y="77" fill="#C2607A" font-size="11" text-anchor="middle" font-weight="600">4.5 m</text>

  <!-- 尺寸:左緣進深 -->
  <line x1="102" y1="90" x2="102" y2="750" stroke="#C2607A" stroke-width="1"/>
  <line x1="96" y1="90" x2="108" y2="90" stroke="#C2607A" stroke-width="1"/>
  <line x1="96" y1="750" x2="108" y2="750" stroke="#C2607A" stroke-width="1"/>
  <rect x="92" y="410" width="20" height="20" fill="#FBFAF9"/>
  <text x="102" y="424" fill="#C2607A" font-size="11" text-anchor="middle" font-weight="600" transform="rotate(-90 102 420)">11 m</text>

  <!-- 入口(前方短邊,左側) -->
  <rect x="120" y="720" width="90" height="30" fill="#FBFAF9"/>
  <path d="M 120 750 A 55 55 0 0 0 175 695" fill="none" stroke="#C2607A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="120" y1="750" x2="180" y2="750" stroke="#FAD6DC" stroke-width="6"/>
  <text x="128" y="738" fill="#C2607A" font-size="11" font-weight="600">入口</text>

  <!-- 報到櫃台(入口旁,右前) -->
  <rect x="250" y="672" width="128" height="66" rx="6" fill="#DBC3B5" stroke="#B89A85" stroke-width="1.5"/>
  <text x="314" y="700" fill="#5A4A3A" font-size="12" font-weight="600" text-anchor="middle">報到櫃台</text>
  <text x="314" y="718" fill="#7A6A5A" font-size="9" text-anchor="middle">POS · 開桌</text>

  <!-- 6桌 縱向雙排(左排3+右排3) -->
  <!-- 桌80px見方(1.33m含椅範圍縮放),桌號 -->
  <!-- 左排 x中心約185, 右排 x中心約325 -->
  <!-- Y位置:由上到下 3層 -->

  <!-- 左排 T1(上) T3(中) T5(下) / 右排 T2 T4 T6 -->
  <!-- 桌位資料 -->
  <!-- Row1 y~170 -->
  <g>
    <rect x="146" y="140" width="72" height="72" rx="8" fill="#FAD6DC" stroke="#C2607A" stroke-width="2"/>
    <rect x="169" y="163" width="26" height="26" rx="4" fill="#FFF" stroke="#E0AEBC"/>
    <text x="182" y="181" fill="#C2607A" font-size="12" font-weight="700" text-anchor="middle">T1</text>
    <rect x="170" y="121" width="24" height="12" rx="3" fill="#EFE3DA"/><rect x="170" y="219" width="24" height="12" rx="3" fill="#EFE3DA"/>
    <rect x="126" y="164" width="12" height="24" rx="3" fill="#EFE3DA"/><rect x="226" y="164" width="12" height="24" rx="3" fill="#EFE3DA"/>
  </g>
  <g>
    <rect x="292" y="140" width="72" height="72" rx="8" fill="#FAD6DC" stroke="#C2607A" stroke-width="2"/>
    <rect x="315" y="163" width="26" height="26" rx="4" fill="#FFF" stroke="#E0AEBC"/>
    <text x="328" y="181" fill="#C2607A" font-size="12" font-weight="700" text-anchor="middle">T2</text>
    <rect x="316" y="121" width="24" height="12" rx="3" fill="#EFE3DA"/><rect x="316" y="219" width="24" height="12" rx="3" fill="#EFE3DA"/>
    <rect x="272" y="164" width="12" height="24" rx="3" fill="#EFE3DA"/><rect x="372" y="164" width="12" height="24" rx="3" fill="#EFE3DA"/>
  </g>
  <!-- Row2 y~330 -->
  <g>
    <rect x="146" y="300" width="72" height="72" rx="8" fill="#FAD6DC" stroke="#C2607A" stroke-width="2"/>
    <rect x="169" y="323" width="26" height="26" rx="4" fill="#FFF" stroke="#E0AEBC"/>
    <text x="182" y="341" fill="#C2607A" font-size="12" font-weight="700" text-anchor="middle">T3</text>
    <rect x="170" y="281" width="24" height="12" rx="3" fill="#EFE3DA"/><rect x="170" y="379" width="24" height="12" rx="3" fill="#EFE3DA"/>
    <rect x="126" y="324" width="12" height="24" rx="3" fill="#EFE3DA"/><rect x="226" y="324" width="12" height="24" rx="3" fill="#EFE3DA"/>
  </g>
  <g>
    <rect x="292" y="300" width="72" height="72" rx="8" fill="#FAD6DC" stroke="#C2607A" stroke-width="2"/>
    <rect x="315" y="323" width="26" height="26" rx="4" fill="#FFF" stroke="#E0AEBC"/>
    <text x="328" y="341" fill="#C2607A" font-size="12" font-weight="700" text-anchor="middle">T4</text>
    <rect x="316" y="281" width="24" height="12" rx="3" fill="#EFE3DA"/><rect x="316" y="379" width="24" height="12" rx="3" fill="#EFE3DA"/>
    <rect x="272" y="324" width="12" height="24" rx="3" fill="#EFE3DA"/><rect x="372" y="324" width="12" height="24" rx="3" fill="#EFE3DA"/>
  </g>
  <!-- Row3 y~490 -->
  <g>
    <rect x="146" y="460" width="72" height="72" rx="8" fill="#FAD6DC" stroke="#C2607A" stroke-width="2"/>
    <rect x="169" y="483" width="26" height="26" rx="4" fill="#FFF" stroke="#E0AEBC"/>
    <text x="182" y="501" fill="#C2607A" font-size="12" font-weight="700" text-anchor="middle">T5</text>
    <rect x="170" y="441" width="24" height="12" rx="3" fill="#EFE3DA"/><rect x="170" y="539" width="24" height="12" rx="3" fill="#EFE3DA"/>
    <rect x="126" y="484" width="12" height="24" rx="3" fill="#EFE3DA"/><rect x="226" y="484" width="12" height="24" rx="3" fill="#EFE3DA"/>
  </g>
  <g>
    <rect x="292" y="460" width="72" height="72" rx="8" fill="#FAD6DC" stroke="#C2607A" stroke-width="2"/>
    <rect x="315" y="483" width="26" height="26" rx="4" fill="#FFF" stroke="#E0AEBC"/>
    <text x="328" y="501" fill="#C2607A" font-size="12" font-weight="700" text-anchor="middle">T6</text>
    <rect x="316" y="441" width="24" height="12" rx="3" fill="#EFE3DA"/><rect x="316" y="539" width="24" height="12" rx="3" fill="#EFE3DA"/>
    <rect x="272" y="484" width="12" height="24" rx="3" fill="#EFE3DA"/><rect x="372" y="484" width="12" height="24" rx="3" fill="#EFE3DA"/>
  </g>

  <!-- 中央縱向主走道 -->
  <line x1="255" y1="120" x2="255" y2="560" stroke="#C9C4C0" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="255" y="585" fill="#B5B0AC" font-size="10" text-anchor="middle">主走道 ~0.9m</text>

  <!-- 茶水/出餐(最裡左) -->
  <rect x="132" y="602" width="108" height="66" rx="6" fill="#EFE3DA" stroke="#C9B8A8" stroke-width="1.5"/>
  <text x="186" y="628" fill="#7A6253" font-size="11" font-weight="600" text-anchor="middle">茶水/出餐</text>
  <text x="186" y="645" fill="#9A8574" font-size="9" text-anchor="middle">備餐檯·飲品</text>

  <!-- 廁所改到最前端右(入口對側)已被櫃台佔,改放最裡?狹長把廁所放最裡右較常見,但茶水在裡左,右邊放廁所 -->
  <!-- 廁所(最裡右下角,靠茶水) -->
  <rect x="252" y="602" width="126" height="60" rx="6" fill="#E8E5E2" stroke="#C4C0BC" stroke-width="1.5"/>
  <text x="315" y="630" fill="#6E6965" font-size="11" font-weight="600" text-anchor="middle">廁所 WC</text>

  <!-- 圖例 -->
  <rect x="34" y="772" width="492" height="130" rx="8" fill="#FFF" stroke="#ECEAE9"/>
  <text x="50" y="794" fill="#2E2B2C" font-size="12" font-weight="600">圖例 / 說明</text>
  <rect x="50" y="806" width="18" height="18" rx="4" fill="#FAD6DC" stroke="#C2607A" stroke-width="1.5"/>
  <text x="76" y="819" fill="#6E6965" font-size="11">自動麻將桌 ×6 (縱向雙排)</text>
  <rect x="270" y="806" width="18" height="18" rx="4" fill="#DBC3B5"/>
  <text x="296" y="819" fill="#6E6965" font-size="11">報到櫃台(近入口)</text>
  <rect x="50" y="834" width="18" height="18" rx="4" fill="#EFE3DA"/>
  <text x="76" y="847" fill="#6E6965" font-size="11">茶水/出餐(最裡)</text>
  <rect x="270" y="834" width="18" height="18" rx="4" fill="#E8E5E2"/>
  <text x="296" y="847" fill="#6E6965" font-size="11">廁所(最裡)</text>
  <text x="50" y="874" fill="#C2607A" font-size="11" font-weight="600">動線:入口→櫃台報到→沿主走道入座→最裡茶水/廁所</text>
  <text x="50" y="892" fill="#9B9591" font-size="9.5">＊狹長型優勢:面寬省租金、動線單純好管理。實際須依樑柱、管線、消防逃生與法規調整。</text>
</svg>
